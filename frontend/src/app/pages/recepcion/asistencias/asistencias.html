<div class="p-10">
  <header class="mb-8">
    <p class="text-[11px] tracking-[0.4em] text-yellow-400 uppercase mb-2">
      Recepción / Asistencias
    </p>
    <h1 class="text-4xl font-black tracking-tight">Asistencias de hoy</h1>
  </header>

  <div class="bg-[#111] border border-yellow-500/20 p-6 mb-8">
    <p class="text-[10px] tracking-[0.3em] text-yellow-400/80 uppercase mb-3">
      Registrar entrada
    </p>
    <div class="flex gap-3">
      <input [(ngModel)]="busqueda"
             (keyup.enter)="entrar()"
             placeholder="Usuario, correo o nombre del cliente"
             class="flex-1 bg-[#0a0a0a] border border-yellow-500/20 px-4 py-3
                    focus:outline-none focus:border-yellow-400
                    placeholder:text-neutral-600" />
      <button (click)="entrar()"
              class="bg-yellow-400 text-black px-8 py-3 text-xs font-bold
                     tracking-[0.2em] uppercase hover:bg-yellow-300 transition">
        registrar
      </button>
    </div>
  </div>

  <div class="bg-[#111] border border-yellow-500/20 overflow-hidden">
    <table class="w-full text-sm">
      <thead>
        <tr class="text-[10px] tracking-[0.3em] uppercase text-yellow-400/80
                   border-b border-yellow-500/20">
          <th class="text-left px-6 py-4">Cliente</th>
          <th class="text-left px-6 py-4">Entrada</th>
          <th class="text-left px-6 py-4">Registrada por</th>
        </tr>
      </thead>
      <tbody>
        @for (a of asistencias(); track a.id) {
          <tr class="border-b border-white/5 hover:bg-yellow-400/5 transition">
            <td class="px-6 py-4 font-semibold">{{ a.cliente }}</td>
            <td class="px-6 py-4 text-neutral-400">{{ hora(a.horaEntrada) }}</td>
            <td class="px-6 py-4 text-neutral-400">{{ a.registradaPor }}</td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</div>
