<main class="min-h-screen bg-neutral-950 text-white font-sans relative overflow-hidden">
  <div class="pointer-events-none absolute inset-0 overflow-hidden">
    <div class="absolute -top-40 -left-40 w-130 h-130 bg-yellow-500/10 rounded-full blur-[130px]"></div>
    <div class="absolute -bottom-40 -right-40 w-130 h-130 bg-yellow-500/10 rounded-full blur-[130px]"></div>
  </div>

  <app-home-navbar [config]="configuracion" [nombre]="nombre()" [esCliente]="esCliente()" (logout)="cerrarSesion()" />
  <app-home-hero [nombre]="nombre()" [esCliente]="esCliente()" [descripcion]="configuracion?.descripcion" [totalPlanes]="planes.length" />
  <app-nosotros-section [config]="configuracion" />
  <app-planes-section [planes]="planes" [cargando]="cargandoPlanes" [error]="errorPlanes" [esCliente]="esCliente()" [planActual]="planActual()" (reintentar)="cargarPlanes()" />
  <app-promociones-section [promociones]="promociones" />
  <app-galeria-section [config]="configuracion" />
  <app-horarios-section [config]="configuracion" />
  <app-ubicacion-section [direccion]="configuracion?.direccion" />
  <app-contacto-section [config]="configuracion" />
</main>
