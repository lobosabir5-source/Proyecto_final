<div class="min-h-screen bg-[#0a0a0a] text-white flex">

  <!-- SIDEBAR -->
  <aside class="w-64 shrink-0 bg-[#0d0d0d] border-r border-yellow-500/20 flex flex-col">

    <div class="px-6 py-6 border-b border-yellow-500/20">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 bg-yellow-400 flex items-center justify-center">
          <span class="text-black font-black text-lg">G</span>
        </div>
        <div>
          <p class="font-black tracking-widest text-sm">GOLD'S FITNESS</p>
          <p class="text-[10px] tracking-[0.3em] text-yellow-400">ÁREA DE MIEMBROS</p>
        </div>
      </div>
    </div>

    <nav class="flex-1 overflow-y-auto py-4">
      @for (grupo of menu; track grupo.seccion) {
        <div class="mb-6">
          <p class="px-6 mb-2 text-[10px] tracking-[0.3em] text-yellow-400/70 uppercase">
            {{ grupo.seccion }}
          </p>
          @for (item of grupo.items; track item.route) {
            <a
              [routerLink]="item.route"
              routerLinkActive="bg-yellow-400/10 text-yellow-300 border-l-2 border-yellow-400"
              class="flex items-center gap-3 px-6 py-2.5 text-sm text-neutral-400
                     hover:text-white hover:bg-white/5 border-l-2 border-transparent
                     transition-all">
              <span class="w-1.5 h-1.5 rounded-full bg-current opacity-60"></span>
              {{ item.label }}
            </a>
          }
        </div>
      }
    </nav>

    <div class="px-6 py-4 border-t border-yellow-500/20">
      <p class="text-[10px] tracking-[0.3em] text-yellow-400/70 uppercase mb-1">Sesión</p>
      <p class="text-sm font-semibold mb-3">{{ usuario() }}</p>
      <button (click)="cerrarSesion()"
              class="w-full py-2 text-xs tracking-[0.2em] uppercase
                     border border-yellow-400/40 text-yellow-300
                     hover:bg-yellow-400 hover:text-black transition">
        Cerrar sesión
      </button>
    </div>
  </aside>

  <main class="flex-1 overflow-y-auto">
    <router-outlet />
  </main>
</div>
