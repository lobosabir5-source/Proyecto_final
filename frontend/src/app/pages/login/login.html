<main class="login-shell">
  <section class="brand-side" aria-label="Gold's Gym">
    <p class="brand-mark">G<span>G</span></p>
    <p class="brand-name">GOLD'S GYM</p>
    <p class="brand-line">DISCIPLINE<br />BUILDS POWER</p>
  </section>

  <section class="login-card" aria-labelledby="login-title">
    <p class="eyebrow">MEMBER ACCESS</p>
    <h1 id="login-title">Iniciar sesión</h1>
    <p class="subtitle">Entra a tu espacio de entrenamiento.</p>

    <form (ngSubmit)="login()" #loginForm="ngForm">
      <label for="usuario">Usuario</label>
      <input id="usuario" name="usuario" type="text" autocomplete="username"
        placeholder="Tu usuario" [(ngModel)]="usuario" required />

      <label for="password">Contraseña</label>
      <input id="password" name="password" type="password" autocomplete="current-password"
        placeholder="Tu contraseña" [(ngModel)]="password" required />

      <p class="error" *ngIf="error" role="alert">{{ error }}</p>

      <button type="submit" [disabled]="loading || loginForm.invalid">
        {{ loading ? 'Comprobando...' : 'Entrar' }}
      </button>
    </form>

    <p class="security-note">Acceso protegido por Spring Security y JWT.</p>
  </section>
</main>
