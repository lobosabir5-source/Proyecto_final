spring.application.name=Gimnasio

spring.datasource.url=jdbc:postgresql://localhost:5432/golds_gym
spring.datasource.username=postgres
spring.datasource.password=admin1234

# Generación automática de tablas y logs de SQL
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ejecuta data.sql en Postgres
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# clave usada para firmar los tokens jwt; en produccion debe venir de una variable de entorno
app.jwt.secret=${JWT_SECRET:ojalafuncionetodoestobienporquesinomuero}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Configuracion opcional para crear el primer administrador
app.admin.username=${APP_ADMIN_USERNAME:}
app.admin.password=${APP_ADMIN_PASSWORD:}

# Carpeta donde se guardan las imagenes subidas
app.uploads.dir=${APP_UPLOADS_DIR:uploads}
# Por defecto Spring rechaza archivos de mas de 1MB; con esto aceptamos hasta 5MB
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
