spring.application.name=Gimnasio

spring.datasource.url=jdbc:postgresql://localhost:5432/golds_gym
spring.datasource.username=postgres
spring.datasource.password=admin1234

# Generación automática de tablas y logs de SQL
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ejecutar data.sql en Postgres (no solo en BD embebida) y hacerlo despues de que Hibernate cree las tablas
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# clave usada para firmar los tokens jwt; en produccion debe venir de una variable de entorno
app.jwt.secret=${JWT_SECRET:ojalafuncionetodoestobienporquesinomuero}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}